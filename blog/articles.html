  <main>

    <!-- ===========================================================
         ARTICLES LISTING PAGE
         Controls: layout — css/style.css (.listing-page, .page-header)
                   filter badges — css/style.css (.filter-bar, .filter-badge)
                   cards grid — css/style.css (.listing-grid)
                   filtering logic — inline script below
         =========================================================== -->
    <div class="listing-page">
      <div class="container">

        <!-- Page header with book icon -->
        <div class="page-header fade-in-up">
          <h1 class="page-title">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
            Articles
          </h1>
          <p class="page-subtitle">
            This space is where my mind dumps packets :)
          </p>
        </div>

        <!-- Filter badges — clicking filters the cards grid below -->
        <div class="filter-bar" id="filter-bar"></div>

        <!-- Cards grid — populated + filtered by inline script -->
        <div class="listing-grid" id="articles-grid"></div>

      </div>
    </div>

<script src="js/data.js"></script>
<script src="js/particles.js"></script>
<script src="js/main.js"></script>
<script>
  /* ── Articles page logic ── */
  const calIcon  = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
  const clkIcon  = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;

  let activeFilter = "All";

  /* Collect all unique tags from articles data */
  const allTags = ["All", ...new Set(ARTICLES.flatMap(a => a.tags))].sort();

  /* Build filter badge bar */
  const filterBar = document.getElementById("filter-bar");
  allTags.forEach(tag => {
    const btn = document.createElement("button");
    btn.className = "filter-badge" + (tag === "All" ? " active" : "");
    btn.textContent = tag;
    btn.addEventListener("click", () => {
      activeFilter = tag;
      filterBar.querySelectorAll(".filter-badge").forEach(b =>
        b.classList.toggle("active", b.textContent === tag));
      renderCards();
    });
    filterBar.appendChild(btn);
  });

  /* Render cards matching active filter */
  function renderCards() {
    const filtered = activeFilter === "All"
      ? ARTICLES
      : ARTICLES.filter(a => a.tags.includes(activeFilter));

    const grid = document.getElementById("articles-grid");

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">No articles found for this category.</div>`;
      return;
    }

    grid.innerHTML = filtered.map((a, i) => {
      const tags = a.tags.map(t => `<span class="badge badge-secondary">${t}</span>`).join('');
      return `
        <a href="article.html?id=${a.id}" class="card fade-in-up" style="--delay:${i * 0.07}s">
          <div class="card-header">
            <div class="flex gap-1" style="flex-wrap:wrap;margin-bottom:0.5rem">${tags}</div>
            <div class="card-title">${a.title}</div>
          </div>
          <div class="card-body">
            <p class="card-excerpt">${a.excerpt}</p>
          </div>
          <div class="card-footer">
            <span class="card-meta-item">${calIcon} ${a.date}</span>
            <span class="card-meta-item">${clkIcon} ${a.readTime}</span>
          </div>
        </a>`;
    }).join('');

    /* Re-observe newly created .fade-in-up elements */
    grid.querySelectorAll('.fade-in-up').forEach(el => {
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
      }, { threshold: 0.05 });
      obs.observe(el);
    });
  }

  renderCards();
</script>

</body>
