    <!-- ===========================================================
         WRITEUPS LISTING PAGE
         Controls: layout — css/style.css (.listing-page)
                   tabs bar — css/style.css (.tabs-bar, .tab-btn)
                   cards grid — css/style.css (.listing-grid)
                   filtering logic — inline script below
         =========================================================== -->
    <div class="listing-page">
      <div class="container">

        <!-- Page header with flag icon -->

          <h1 class="page-title">

            Writeups

           My way of turning hard challenges into simple explanations

        </div>

        <!-- Category tabs -->

<script src="js/data.js"></script>
<script src="js/particles.js"></script>
<script src="js/main.js"></script>
<script>
  /* ── Writeups page logic ── */
  const shIcon     = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`;
  const wrenchIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`;
  const chevRight  = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>`;

  const CATEGORIES = ["All", "DFIR" , "Threat Hunting", "Threat Intelligence" , "Reverse Engineering"];
  let activeTab = "All";

  function diffClass(d) {
    return { Easy:'badge-easy', Medium:'badge-medium', Hard:'badge-hard' }[d] || 'badge-outline';
  }

  /* Build tab bar */
  const tabsBar = document.getElementById("tabs-bar");
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (cat === "All" ? " active" : "");
    btn.textContent = cat;
    btn.addEventListener("click", () => {
      activeTab = cat;
      tabsBar.querySelectorAll(".tab-btn").forEach(b =>
        b.classList.toggle("active", b.textContent === cat));
      renderWriteups();
    });
    tabsBar.appendChild(btn);
  });

  /* Render writeup cards */
  function renderWriteups() {
    const filtered = activeTab === "All"
      ? WRITEUPS
      : WRITEUPS.filter(w => w.category === activeTab);

    const grid = document.getElementById("writeups-grid");

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">No writeups found for this category yet.</div>`;
      return;
    }

    grid.innerHTML = filtered.map((w, i) => {
      const tools = w.tools.map(t => `<span class="tool-tag">${t}</span>`).join('');
      return `
        <a href="writeup.html?id=${w.id}" class="card fade-in-up" style="--delay:${i * 0.07}s">
          <div class="card-header">
            <div class="flex justify-between" style="margin-bottom:0.75rem">
              <span class="badge badge-primary">${w.ctf}</span>
              <span class="badge ${diffClass(w.difficulty)}">${w.difficulty}</span>
            </div>
            <div class="card-title" style="display:flex;align-items:center;gap:0.5rem">
              ${shIcon} ${w.challenge}
            </div>
          </div>
          <div class="card-body">
            <p class="card-excerpt">${w.description}</p>
            <div class="tools-row">
              <span class="tools-label">${wrenchIcon} Tools:</span>
              ${tools}
            </div>
          </div>
          <div class="card-footer card-action">
            <span>Read Solution</span>
            ${chevRight}
          </div>
        </a>`;
    }).join('');

    grid.querySelectorAll('.fade-in-up').forEach(el => {
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
      }, { threshold: 0.05 });
      obs.observe(el);
    });
  }

  renderWriteups();
</script>

</body>
